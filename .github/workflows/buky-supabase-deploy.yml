name: Supabase · aplicar Buky en producción

# Manual (Actions → este workflow → Run workflow). Aplica los pasos SQL de Buky,
# opcionalmente los datos de prueba de Niterói, y publica la Edge Function buky-close-session.
# Secretos necesarios (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL        cadena de conexión de Postgres (Project Settings → Database → Connection string, modo Session)
#   SUPABASE_ACCESS_TOKEN  token personal de Supabase (Account → Access Tokens), solo para publicar la función
# Los pasos SQL son idempotentes: volver a correrlos no rompe ni duplica nada.
on:
  workflow_dispatch:
    inputs:
      sql:
        description: "Aplicar los pasos SQL de Buky (15–17 y 19 en adelante)"
        type: boolean
        default: true
      datos_prueba:
        description: "Cargar los datos de prueba de Niterói ([TESTE])"
        type: boolean
        default: true
      funciones:
        description: "Otras Edge Functions a publicar, separadas por espacio (p. ej. buky-close-session match-face)"
        type: string
        default: ""
      funciones_pagos:
        description: "Publicar create-premium-checkout y sync-premium-payment (Premium y recargas)"
        type: boolean
        default: false
      funciones_avisos:
        description: "Publicar send-notifications e invite-sponsor"
        type: boolean
        default: false
      ciudades:
        description: "Paso 18: normalizar la ciudad de los usuarios existentes (con respaldo)"
        type: boolean
        default: false
      datos_sorteios:
        description: "Cargar los datos de prueba de sorteos (premios con imágenes, próximo y pasado)"
        type: boolean
        default: false
      premio_teste_email:
        description: "E-mail de un atleta para darle un premio [TESTE] con QR (prueba del canje)"
        type: string
        default: ""

concurrency:
  group: buky-supabase-deploy
  cancel-in-progress: false

env:
  PROJECT_REF: ljizlialjsonmmvppoqh

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Verificar secretos
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          [ -n "$DB" ] || { echo "::error::Falta el secreto SUPABASE_DB_URL"; exit 1; }
          if { [ -n "${{ inputs.funciones }}" ] || [ "${{ inputs.funciones_pagos }}" = "true" ] || [ "${{ inputs.funciones_avisos }}" = "true" ]; } && [ -z "$TOKEN" ]; then echo "::error::Falta el secreto SUPABASE_ACCESS_TOKEN"; exit 1; fi
          echo "$DB" | grep -q "$PROJECT_REF" || { echo "::error::SUPABASE_DB_URL no es del proyecto $PROJECT_REF"; exit 1; }
          echo "::notice title=Proyecto::$PROJECT_REF"

      - name: Instalar psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null && psql --version

      - name: Aplicar pasos SQL 15–17 y 19–30
        if: inputs.sql
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -e
          for f in supabase/manual-sql/buky/15_*.sql supabase/manual-sql/buky/16_*.sql supabase/manual-sql/buky/17_*.sql supabase/manual-sql/buky/19_*.sql supabase/manual-sql/buky/20_*.sql supabase/manual-sql/buky/21_*.sql supabase/manual-sql/buky/22_*.sql supabase/manual-sql/buky/23_*.sql supabase/manual-sql/buky/24_*.sql supabase/manual-sql/buky/25_*.sql supabase/manual-sql/buky/26_*.sql supabase/manual-sql/buky/27_*.sql supabase/manual-sql/buky/28_*.sql supabase/manual-sql/buky/29_*.sql supabase/manual-sql/buky/30_*.sql supabase/manual-sql/buky/31_*.sql supabase/manual-sql/buky/32_*.sql supabase/manual-sql/buky/33_*.sql; do
            psql "$DB" -q -v ON_ERROR_STOP=1 -f "$f" >/dev/null
            echo "::notice title=SQL aplicado::$(basename "$f") · sha256 $(sha256sum "$f" | cut -c1-12)"
          done

      - name: Normalizar ciudades de usuarios (paso 18)
        if: inputs.ciudades
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$DB" -q -v ON_ERROR_STOP=1 -At -F ' · ' -f supabase/manual-sql/buky/18_normalizar_ciudades_usuarios.sql \
            | sed 's/^/::notice title=Ciudades (paso 18)::/'

      - name: Cargar datos de prueba
        if: inputs.datos_prueba
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
        run: psql "$DB" -q -v ON_ERROR_STOP=1 -f supabase/manual-sql/buky/datos_prueba_niteroi.sql | tail -3 | sed 's/^/::notice title=Datos de prueba::/'

      - name: Cargar datos de prueba de sorteos
        if: inputs.datos_sorteios
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
        run: psql "$DB" -q -v ON_ERROR_STOP=1 -At -F ' · ' -f supabase/manual-sql/buky/datos_prueba_sorteios.sql | tail -3 | sed 's/^/::notice title=Datos de sorteos::/'

      - name: Premio de prueba para un atleta
        if: inputs.premio_teste_email != ''
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
          EMAIL: ${{ inputs.premio_teste_email }}
        run: psql "$DB" -q -v ON_ERROR_STOP=1 -v email="$EMAIL" -f supabase/manual-sql/buky/prueba_premio_atleta.sql 2>&1 | grep -E "OK|ya existía|ERROR" | sed 's/^/::notice title=Premio de prueba::/'

      - name: Verificar en la base
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$DB" -At -F ' · ' -c "
            SELECT 'ciudades=' || (SELECT count(*) FROM public.br_cities),
                   'estados=' || (SELECT count(*) FROM public.br_states),
                   'rutas activas=' || (SELECT count(*) FROM public.buky_routes WHERE active),
                   'puntos=' || (SELECT count(*) FROM public.buky_points),
                   'periodos=' || (SELECT string_agg(status, ',') FROM public.buky_raffle_periods),
                   'cupones=' || (SELECT count(*) FROM public.buky_coupons),
                   'cron=' || (SELECT count(*) FROM cron.job WHERE jobname = 'buky-raffle-tick'),
                   'bucket=' || (SELECT count(*) FROM storage.buckets WHERE id = 'buky-tracks')" \
            | sed 's/^/::notice title=Base::/'
          psql "$DB" -At -F ' ' -c "SELECT status, count(*) FROM public.buky_match_user_cities() GROUP BY status ORDER BY 1" \
            | sed 's/^/::notice title=Ciudades de usuarios (vista previa, sin aplicar)::/'

      - name: Publicar otras Edge Functions
        if: inputs.funciones != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          FUNCIONES: ${{ inputs.funciones }}
        run: |
          # Solo nombres de carpetas existentes en supabase/functions; las públicas van sin verificación de JWT.
          for f in $FUNCIONES; do
            [ -d "supabase/functions/$f" ] || { echo "::error::No existe la función $f"; exit 1; }
            case "$f" in mercadopago-webhook|send-notifications|invite-sponsor) extra="--no-verify-jwt" ;; *) extra="" ;; esac
            npx --yes supabase@2 functions deploy "$f" --project-ref "$PROJECT_REF" --use-api $extra
            echo "::notice title=Edge Function::$f publicada en $PROJECT_REF"
          done

      - name: Publicar funciones de pago
        if: inputs.funciones_pagos
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          for f in create-premium-checkout sync-premium-payment; do
            npx --yes supabase@2 functions deploy "$f" --project-ref "$PROJECT_REF" --use-api
            echo "::notice title=Edge Function::$f publicada en $PROJECT_REF"
          done

      - name: Publicar funciones de avisos
        if: inputs.funciones_avisos
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          npx --yes supabase@2 functions deploy send-notifications --project-ref "$PROJECT_REF" --use-api --no-verify-jwt
          npx --yes supabase@2 functions deploy invite-sponsor --project-ref "$PROJECT_REF" --use-api --no-verify-jwt

